name: Deploy to Play Store Closed Testing

on:
  push:
    branches:
      - closed-test
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: closed-test-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_CONSOLE_JSON_BASE64: ${{ secrets.PLAY_CONSOLE_JSON_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS PLAY_CONSOLE_JSON_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle
        run: |
          set -euo pipefail
          base_build_number="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' pubspec.yaml)"
          if [[ -z "$base_build_number" ]]; then
            echo "Could not read the build number from pubspec.yaml" >&2
            exit 1
          fi
          build_number_floor=3
          if (( base_build_number > build_number_floor )); then
            build_number_floor="$base_build_number"
          fi
          build_number="$((build_number_floor + GITHUB_RUN_NUMBER))"
          flutter build appbundle --release --build-number "$build_number"

      - name: Configure Google Play service account
        env:
          PLAY_CONSOLE_JSON_BASE64: ${{ secrets.PLAY_CONSOLE_JSON_BASE64 }}
        run: printf '%s' "$PLAY_CONSOLE_JSON_BASE64" | base64 --decode > service-account.json

      - name: Upload draft to closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: me.muhammadessam.FPLpro
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: alpha
          status: draft
