name: Press notes experiment

# Times small local models (Ollama, CPU only) reading a Gameweek's team news
# and scores them against the minutes players then played. See
# tool/press_notes_experiment/press_notes.py.
on:
  push:
    branches: [experiment/ollama-press-notes]
    paths:
      - 'tool/press_notes_experiment/**'
      - '.github/workflows/press_notes_experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GAMEWEEK: 7

jobs:
  run:
    name: ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [rules, 'qwen2.5:3b', 'llama3.2:3b', 'gemma3:4b', 'qwen2.5:7b']
    steps:
      - uses: actions/checkout@v4

      - name: Runner
        run: |
          nproc
          free -h

      - name: Install Ollama
        if: matrix.model != 'rules'
        run: |
          start=$(date +%s)
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          if ! curl -sf http://localhost:11434/api/version; then
            nohup ollama serve > ollama.log 2>&1 &
            for i in $(seq 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          fi
          echo "INSTALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Pull model
        if: matrix.model != 'rules'
        run: |
          start=$(date +%s)
          ollama pull '${{ matrix.model }}'
          echo "PULL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          ollama list

      - name: Extract and score
        run: |
          if [ '${{ matrix.model }}' = rules ]; then
            python3 tool/press_notes_experiment/press_notes.py --gameweek "$GAMEWEEK" --method rules --out results
          else
            python3 tool/press_notes_experiment/press_notes.py --gameweek "$GAMEWEEK" --method ollama \
              --model '${{ matrix.model }}' --out results
          fi
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          for path in glob.glob('results/*.json'):
              s = json.load(open(path))['summary']
              s['install_seconds'] = os.environ.get('INSTALL_SECONDS')
              s['pull_seconds'] = os.environ.get('PULL_SECONDS')
              json.dump(json.load(open(path)) | {'summary': s}, open(path, 'w'), indent=1, ensure_ascii=False)
              print(f"### {s['method']}\n\n```json\n{json.dumps(s, indent=1)}\n```")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: press-notes-${{ strategy.job-index }}
          path: results/
          retention-days: 3
