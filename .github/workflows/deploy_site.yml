name: Deploy website

on:
  push:
    branches: [development, main]
    paths:
      - 'site/**'
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'packages/fpl_engine/**'
      - '.github/workflows/deploy_site.yml'
  # Refreshes the precomputed predictions at /data/v1/ (see
  # packages/fpl_engine/bin/publish_predictions.dart); the app ignores files
  # older than 36 hours and computes on device instead.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Pushes the FPL news snapshots to their own branch.
      contents: write
    steps:
      # Scheduled runs use the default branch's workflow but must not roll the
      # site back to it, so they build development, which deploys on push.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'development' || '' }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Build site and web app
        env:
          ADSENSE_SLOT_BANNER: ${{ vars.ADSENSE_SLOT_BANNER }}
          ADSENSE_SLOT_RAIL: ${{ vars.ADSENSE_SLOT_RAIL }}
        run: |
          flutter pub get
          site/build.sh

      # A code deploy still goes out without predictions (the app computes
      # them on device), but a scheduled run that only exists to refresh them
      # stops here rather than deploying without them.
      - name: Publish predictions
        id: predictions
        continue-on-error: true
        working-directory: packages/fpl_engine
        run: |
          dart pub get
          dart run bin/publish_predictions.dart --out ../../site/dist/data \
            --news-snapshot "$RUNNER_TEMP/news.json"

      # Keeps FPL's own injury news as it stood before each deadline, so the
      # press-conference experiment can be compared with it later. One file,
      # one commit per change: the branch history is the snapshot archive.
      - name: Save FPL news snapshot
        if: >-
          steps.predictions.outcome == 'success' &&
          (github.event_name == 'schedule' || github.ref == 'refs/heads/development')
        continue-on-error: true
        run: |
          dir="$RUNNER_TEMP/fpl-news-snapshots"
          if git fetch --depth=1 origin fpl-news-snapshots; then
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" checkout -B fpl-news-snapshots
          else
            git worktree add --orphan -b fpl-news-snapshots "$dir"
          fi
          # The first line holds the snapshot time; compare only the players.
          if [ -f "$dir/news.json" ] &&
            cmp -s <(tail -n +2 "$dir/news.json") <(tail -n +2 "$RUNNER_TEMP/news.json"); then
            echo "FPL news unchanged since the last snapshot."
            exit 0
          fi
          cp "$RUNNER_TEMP/news.json" "$dir/news.json"
          cd "$dir"
          git add news.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "FPL news at $(jq -r '.takenAt' news.json)"
          git push origin fpl-news-snapshots

      - name: Deploy site
        if: github.event_name != 'schedule' || steps.predictions.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.0"
          workingDirectory: site
          command: deploy
